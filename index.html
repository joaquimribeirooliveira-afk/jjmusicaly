<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>jjmusicaly</title>
</head>
<body>

    <!-- Cabeçalho Principal -->
    <header>
        <h1>jjmusicaly</h1>
        <p class="subtitulo">Sua Playlist de OSTs de Jogos</p>
    </header>

    <main class="container-principal">
        
        <!-- Tela Grande / Vídeo Central -->
        <section class="video-destaque">
            <iframe 
                name="player-principal" 
                src="https://www.youtube.com/embed/3itXDs82fHM" 
                title="Player de Músicas" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </section>

        <!-- Lista de Vídeos para Selecionar (Estilo Mini YouTube Neon) -->
        <section class="lista-videos">
            
            <div class="categoria">
                <h2>TBB</h2>
                <div class="botoes-musicas">
                    <a href="https://www.youtube.com/embed/3itXDs82fHM" target="player-principal" class="btn-musica">Hell's Kitchen</a>
                    <a href="https://www.youtube.com/embed/sl_CSj-yZPc" target="player-principal" class="btn-musica">Gentleman's Revival</a>
                    <a href="https://www.youtube.com/embed/hRv2mV0ydO8" target="player-principal" class="btn-musica">Waltz of Infamy</a>
                </div>
            </div>

            <div class="categoria">
                <h2>DDLC</h2>
                <div class="botoes-musicas">
                    <a href="https://www.youtube.com/embed/al1BNB8bKaE" target="player-principal" class="btn-musica">Sayo-nara</a>
                    <a href="https://www.youtube.com/embed/QIHUK68L9qQ" target="player-principal" class="btn-musica">I Still Love You</a>
                    <a href="https://www.youtube.com/embed/CAL4WMpBNs0" target="player-principal" class="btn-musica">Your Reality (Credits)</a>
                </div>
            </div>

            <div class="categoria">
                <h2>BLOCK TALES</h2>
                <div class="botoes-musicas">
                    <a href="https://www.youtube.com/embed/ODVRXrTPMLU" target="player-principal" class="btn-musica">Trinity Council</a>
                    <a href="https://www.youtube.com/embed/wY4AX1zupII" target="player-principal" class="btn-musica">Captain Trotter</a>
                    <a href="https://www.youtube.com/embed/W6zKyDvidOc" target="player-principal" class="btn-musica">I'm Your Captain Now</a>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
